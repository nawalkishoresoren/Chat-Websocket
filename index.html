<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Chat 💬</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    h2 { margin-bottom: 6px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5a6fd6; }
    .error { color: #d33; font-size: 13px; margin-bottom: 10px; }
    .divider {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin: 16px 0 12px;
    }
    .join-btn { background: #764ba2; }
    .join-btn:hover { background: #6a4191; }

    #timer {
      text-align: center;
      font-weight: 700;
      color: #d33;
      margin-bottom: 8px;
      font-size: 18px;
    }
    #online { text-align: center; color: #888; font-size: 12px; margin-bottom: 10px; }
    .room-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f2fa;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .room-bar button {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
      background: #764ba2;
    }
    .room-bar button:hover { background: #6a4191; }
    #messages {
      border: 1px solid #eee;
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .card {
        padding: 15px;
        border-radius: 8px;
      }
      h2 { font-size: 18px; }
      input, select, button {
        padding: 12px;
        font-size: 16px;
      }
      .room-bar {
        flex-direction: column;
        gap: 8px;
      }
      .room-bar button {
        width: 100%;
      }
      #messages {
        height: 200px;
      }
      .row {
        flex-direction: column;
      }
      .row input, .row button {
        width: 100%;
        margin-bottom: 8px;
      }
      .row button {
        width: 100%;
      }
    }
    .msg { margin-bottom: 10px; }
    .msg .who { font-weight: 700; font-size: 13px; }
    .msg .when { color: #aaa; font-size: 11px; margin-left: 6px; }
    .msg .text { font-size: 14px; }
    .system { color: #999; font-style: italic; font-size: 12px; text-align: center; margin: 6px 0; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; margin-bottom: 0; }
    .row button { width: 90px; }
    #closed {
      display: none;
      text-align: center;
      color: #d33;
      font-weight: 600;
      margin-bottom: 10px;
    }
  </style>
<base target="_blank">
</head>
<body>

  <!-- HOME SCREEN -->
  <div class="card" id="home">
    <h2>💬 Temp Chat</h2>
    <div class="sub">Create a room. Chat. It self-destructs when time runs out.</div>
    <div class="error" id="homeError"></div>
    <input id="username" placeholder="Your name" maxlength="30">
    <input id="roomName" placeholder="Room name" maxlength="50">
    <select id="minutes">
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
      <option value="20">20 minutes</option>
      <option value="30">30 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60">1 hour</option>
    </select>
    <button onclick="createRoom()">Create Room</button>

    <div class="divider">or join an existing room</div>
    <input id="joinName" placeholder="Your name" maxlength="30">
    <input id="joinId" placeholder="Room ID (e.g. a1b2c3d4)" maxlength="8">
    <button onclick="joinRoom()" class="join-btn">Join Room</button>
  </div>

  <!-- CHAT SCREEN -->
  <div class="card" id="chat" style="display:none">
    <div id="timer">--:--</div>
    <div id="online"></div>
    <div class="room-bar">
      <span>Room: <b id="roomCode"></b></span>
      <button onclick="copyLink()">📋 Copy Invite Link</button>
    </div>
    <div id="closed"></div>
    <div id="messages"></div>
    <div class="row">
      <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <script>
    let ws, expiresAt, countdown, currentRoomId;

    // if someone opened a shared link like http://localhost:8000/?room=a1b2c3d4
    window.addEventListener("load", () => {
      const room = new URLSearchParams(location.search).get("room");
      if (room) document.getElementById("joinId").value = room;
    });

    async function createRoom() {
      const name = document.getElementById("roomName").value;
      const minutes = parseInt(document.getElementById("minutes").value);
      const username = document.getElementById("username").value || "Anonymous";
      document.getElementById("homeError").textContent = "";

      const res = await fetch("/room/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, minutes })
      });
      const data = await res.json();

      if (!res.ok) {
        document.getElementById("homeError").textContent = data.error || "Something went wrong";
        return;
      }

      join(data.roomId, username);
    }

    function joinRoom() {
      const roomId = document.getElementById("joinId").value.trim();
      const username = document.getElementById("joinName").value || "Anonymous";
      if (!roomId) {
        document.getElementById("homeError").textContent = "Enter a room ID.";
        return;
      }
      join(roomId, username);
    }

    function join(roomId, username) {
      currentRoomId = roomId;
      history.replaceState(null, "", `?room=${roomId}`);  // link becomes shareable

      document.getElementById("home").style.display = "none";
      document.getElementById("chat").style.display = "block";
      document.getElementById("roomCode").textContent = roomId;

      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/${roomId}?name=${encodeURIComponent(username)}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "joined") {
          expiresAt = msg.expiresAt;
          document.getElementById("online").textContent = `👥 ${msg.online} online`;
          msg.history.forEach(showMessage);       // load past messages
          startCountdown();
        }
        else if (msg.type === "message") showMessage(msg);
        else if (msg.type === "system") {
          addSystem(msg.text);
          document.getElementById("online").textContent = `👥 ${msg.online} online`;
        }
        else if (msg.type === "error") addSystem(msg.message);
        else if (msg.type === "room-closed") {
          document.getElementById("closed").textContent = msg.reason;
          document.getElementById("closed").style.display = "block";
          document.getElementById("input").disabled = true;
        }
      };
    }

    function copyLink() {
      const link = `${location.origin}/?room=${currentRoomId}`;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector(".room-bar button");
        btn.textContent = "✅ Copied!";
        setTimeout(() => btn.textContent = "📋 Copy Invite Link", 1500);
      });
    }

    function showMessage(m) {
      const div = document.createElement("div");
      div.className = "msg";
      const t = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      div.innerHTML = `<span class="who"></span><span class="when">${t}</span><div class="text"></div>`;
      div.querySelector(".who").textContent = m.name + ":";   // textContent = XSS-safe
      div.querySelector(".text").textContent = m.text;
      document.getElementById("messages").appendChild(div);
      scrollDown();
    }

    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "system";
      div.textContent = text;
      document.getElementById("messages").appendChild(div);
      scrollDown();
    }

    function scrollDown() {
      const box = document.getElementById("messages");
      box.scrollTop = box.scrollHeight;
    }

    function send() {
      const input = document.getElementById("input");
      if (!input.value.trim()) return;
      ws.send(JSON.stringify({ type: "message", text: input.value }));
      input.value = "";
    }

    function startCountdown() {
      clearInterval(countdown);
      countdown = setInterval(() => {
        const left = Math.max(0, expiresAt - Date.now());
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        document.getElementById("timer").textContent =
          `⏳ ${m}:${s.toString().padStart(2, "0")}`;
        if (left <= 0) clearInterval(countdown);
      }, 500);
    }
  </script>
</body>
</html>
